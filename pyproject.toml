[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insforge"
version = "0.1.0"
description = "Python SDK for Insforge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.0",
]

[tool.setuptools]
packages = [
    "insforge",
    "insforge.ai",
    "insforge.auth",
    "insforge.database",
    "insforge.email",
    "insforge.functions",
    "insforge.metadata",
    "insforge.storage",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
